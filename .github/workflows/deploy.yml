name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Change to "master" if your default branch is master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch code from repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Build & Push Node Backend
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend # Ensure this points to your backend directory
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/node-backend:latest

      # 4. Build & Push React Frontend
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend # Ensure this points to your frontend directory
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/react-frontend:latest

      # 5. Connect to Azure VPS and Deploy
      - name: Deploy to Azure VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/app
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
