<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Login Demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Sign in with GitHub</h1>
      <p>Use GitHub OAuth to authenticate a user in a minimal web app.</p>

      <div id="authArea">
        <a class="button" href="/auth/github">Login with GitHub</a>
      </div>

      <section id="profile" class="profile hidden"></section>
    </main>

    <script>
      async function loadUser() {
        const response = await fetch('/api/user');
        const user = await response.json();

        const authArea = document.getElementById('authArea');
        const profile = document.getElementById('profile');

        if (user) {
          authArea.innerHTML = '<button class="button secondary" id="logoutBtn">Logout</button>';
          document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/logout', { method: 'POST' });
            location.reload();
          });

          profile.innerHTML = `
            <h2>Welcome back</h2>
            <img src="${user.avatar_url}" alt="${user.login}" />
            <p><strong>${user.name || user.login}</strong></p>
            <p>${user.bio || 'GitHub user'}</p>
          `;
          profile.classList.remove('hidden');
        } else {
          profile.classList.add('hidden');
        }
      }

      loadUser();
    </script>
  </body>
</html>
